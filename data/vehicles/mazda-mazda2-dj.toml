# Mazda2 (DJ hatch / DL sedan). Source: Mazda Australia owner's manual 8HG8-EO-19IT,
# edition 2 (Jul 2020). The Australian schedule grid (pages 467-468) is transcribed from
# the page image: service n is due at n x 10,000 km ("Base Scheduled Maintenance
# required every 10,000 km, or not longer than 12 months, whichever occurs first").
id = "mazda-mazda2-dj"
make = "Mazda"
model = "Mazda2"
series = "DJ/DL"
yearFrom = 2020
yearTo = 2023
market = "Australia"
doc = "mazda_mazda2_2020"
summary = "Mazda Australia owner's manual, edition 2 (July 2020), with the Australian service schedule."

[[engine]]
id = "g15"
name = "1.5 petrol"
code = "SKYACTIV-G 1.5"
fuel = "petrol"

[[oil]]
