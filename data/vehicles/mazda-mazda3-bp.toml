# Mazda3 (BP). Source: Mazda Australia owner's manual 8HC2-EO-19A, edition 1 (Nov 2018).
# The Australian schedule grid (pages 417-418) marks services by number (1st..16th)
# rather than distance, so it is transcribed here from the page image: service n is
# due at n x 10,000 km or n x 12 months ("Every maintenance must be done within
# 10,000 km, 12 months ... whichever comes first").
id = "mazda-mazda3-bp"
make = "Mazda"
model = "Mazda3"
series = "BP"
yearFrom = 2019
yearTo = 2020
market = "Australia"
doc = "mazda_mazda3_2019"
summary = "Mazda Australia owner's manual, edition 1 (2019 model year), with the Australian service schedule."

[[engine]]
id = "g20"
name = "2.0 petrol"
code = "SKYACTIV-G 2.0"
fuel = "petrol"

[[engine]]
id = "g25"
name = "2.5 petrol"
code = "SKYACTIV-G 2.5"
fuel = "petrol"

[[oil]]
engine = "g20"
litres = 4.2
basis = "With oil filter replacement (4.0 L without)"
page = 522

[[oil]]
engine = "g25"
litres = 4.5
basis = "With oil filter replacement (4.3 L without)"
page = 522

[[tyre]]
