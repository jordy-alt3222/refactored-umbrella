front = 270
rear = 290
condition = "Full load"
page = 525

[[tyre]]
sizes = ["T125/70D16 96M"]
spare = true
front = 420
rear = 420
condition = "Temporary spare"
page = 525

[tpms]
status = "standard"
system = "direct"
text = "Direct system: pressure sensors in each wheel transmit to a receiver; a TPMS warning light and message show when a tyre drops below the specified value. Not marked as optional in the manual. New sensors must have their ID codes registered."
page = 351

[wheelTorque]
minNm = 108
maxNm = 147
text = "108–147 N·m (12–14 kgf·m, 80–108 ft·lbf)"
page = 525

[fuses]
pages = "448-456"

