"A4 AVANT" = "A4"
"A4 ALLROAD" = "A4"
"S4" = "A4"
"A5" = "A5"
"A5 CABRIOLET" = "A5"
"A5 SPORTBACK" = "A5"
"S5" = "A5"
"A6" = "A6"
"Q3" = "Q3"
